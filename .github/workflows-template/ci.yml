# To enable: move this file to .github/workflows/ci.yml and push.
# (Parked here because the GitHub CLI token used to create this repo doesn't
# have the 'workflow' OAuth scope needed to push directly into .github/workflows/.)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=term-missing
